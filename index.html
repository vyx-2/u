<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Lyora~</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background: #ffe6f0;
      font-family: 'Quicksand', sans-serif;
      overflow: hidden;
    }

    .container {
      position: relative;
      max-width: 400px;
      margin: 100px auto;
      background: #fff0f5;
      border-radius: 30px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h1 {
      font-family: 'Pacifico', cursive;
      color: #ff4d6d;
      font-size: 2.5em;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.1em;
      color: #444;
      margin-bottom: 20px;
    }

    button {
      background: #ffb6c1;
      border: none;
      padding: 12px 24px;
      border-radius: 20px;
      font-size: 1em;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #ff6f91;
    }

    .message {
      margin-top: 20px;
      font-size: 1.2em;
      color: #c2185b;
      font-weight: bold;
    }

    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      transform: rotate(45deg);
      animation: float 5s linear infinite;
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: -10px;
      top: 0;
    }

    @keyframes float {
      0% {
        bottom: -20px;
        opacity: 1;
      }
      100% {
        bottom: 100vh;
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>gotchu, i'm Kalaa</h1>
    <p>Jika aku aksara,maka kaulah maknanya</p>
    <button onclick="tampilkanPesan()">Kepo bingiitz?</button>
    <div class="message" id="pesan"></div>
  </div>

  <script>
    const pesanList = [
      "di matamu aku menemukan rumah-tempat segala lelah pulang,dan tempat segala doa menetap.",
      "you are the melody of dusk,wthin my chest gentle,warm and never meant to fade",
      "Cinta tak sepenuhnya tentang kata,tapi diam saling mengerti,dan detik memilih tetap tinggal",
      "Harus kah ku sebutkan berapa kali? im Kala the most handsome boy in a world",
      "Langit tak pernah meminta balasan dari bumi,begitu pun aku"
    ];

    function tampilkanPesan() {
      const random = Math.floor(Math.random() * pesanList.length);
      document.getElementById("pesan").innerText = pesanList[random];
    }

    // Buat efek hati mengambang
    setInterval(() => {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.style.left = Math.random() * window.innerWidth + 'px';
      heart.style.background = ['#ff4d6d','#ff6f91','#ffb6b9'][Math.floor(Math.random()*3)];
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }, 300);
  </script>

</body>
</html>
